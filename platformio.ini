[env:tracker]
platform = platformio/espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default.csv

monitor_speed = 115200

; Puertos serie: dependen de cada equipo. Descomenta y ajusta el tuyo.
; En Windows suelen ser COMx; en Linux /dev/ttyUSBx o /dev/ttyACMx; en macOS /dev/cu.*
; Si se omiten, PlatformIO detecta el puerto automáticamente.
; monitor_port = COM10
; upload_port  = COM10

build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

monitor_filters = time, esp32_exception_decoder


lib_deps =
  mikalhart/TinyGPSPlus@^1.1.0
  jgromes/RadioLib@7.3.0
  
  RobTillaart/MS5611@^0.3.9
  adafruit/Adafruit MAX31865 library@^1.1.0
